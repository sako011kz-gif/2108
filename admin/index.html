<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2108 FITWEAR — Admin</title><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="admin.css"></head><body>
<div id="login" class="auth"><div class="card"><b>2108 <span>FITWEAR</span></b><p>ADMIN PANEL</p><h1>Управление магазином</h1><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Пароль" required><button>ВОЙТИ</button><small id="loginError"></small></form></div></div>
<div id="app" class="hidden"><header><b>2108 <span>FITWEAR</span></b><div><a href="../" target="_blank">Открыть магазин ↗</a><button id="logout">Выйти</button></div></header><main><div class="title"><div><p>ADMIN / PRODUCTS</p><h1>Товары</h1></div><button id="new" class="black">+ ДОБАВИТЬ ТОВАР</button></div><div id="status"></div><div id="list"></div></main></div>
<div id="drawer" class="drawer hidden"><div class="drawer-head"><h2 id="formTitle">Новый товар</h2><button id="close">×</button></div><form id="productForm"><input type="hidden" id="id"><label>Название<input id="name" required></label><div class="two"><label>Цена, ₸<input id="price" type="number" min="0" required></label><label>Категория<select id="category"><option value="tops">TOPS</option><option value="bottoms">BOTTOMS</option><option value="sets">SETS</option><option value="outerwear">OUTERWEAR</option></select></label></div><label>Бейдж<select id="badge"><option>CORE</option><option>NEW</option><option>BESTSELLER</option><option>LIMITED</option><option>2108 EDIT</option></select></label><label>Размеры<div class="checks"><label><input value="XS" type="checkbox">XS</label><label><input value="S" type="checkbox" checked>S</label><label><input value="M" type="checkbox" checked>M</label><label><input value="L" type="checkbox" checked>L</label><label><input value="XL" type="checkbox">XL</label></div></label><label>Описание<textarea id="description" rows="5"></textarea></label><label>Фотографии<input id="images" type="file" accept="image/*" multiple></label><div id="preview"></div><label class="active"><input id="active" type="checkbox" checked> Показывать в магазине</label><button class="black full" id="save">СОХРАНИТЬ ТОВАР</button><button type="button" id="delete" class="danger hidden">УДАЛИТЬ ТОВАР</button><small id="formError"></small></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="admin.js"></script></body></html>
